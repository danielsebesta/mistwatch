[project]
name = "dast-mistral"
version = "0.1.0"
description = "Budget-aware proxy for Mistral Pro/Education: pools Vibe + API allowances, enforces 5h/daily/weekly/monthly pacing limits"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "keyring>=25",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
dast-mistral = "dast_mistral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dast_mistral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
