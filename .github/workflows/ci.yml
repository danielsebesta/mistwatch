name: CI
on:
  push:
    branches: [main, ts-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js --help
  alpine:
    runs-on: ubuntu-latest
    container: node:24-alpine
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check
  # macOS minutes cost 10x on private repos and ARM runners are free only on public ones:
  # run these by hand (Actions > CI > Run workflow) or on release tags
  extra:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js --help
  # Biome ships no FreeBSD binary, so lint runs on the other platforms only
  freebsd:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y node24 npm-node24
          run: |
            cd ts
            npm ci
            npm run typecheck
            npm test
            npm run build
            node dist/cli.js --help
