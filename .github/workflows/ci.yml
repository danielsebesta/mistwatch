name: CI
on:
  push:
    branches: [main, ts-rewrite]
  pull_request:
jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
        node: [24]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js --help
  alpine:
    runs-on: ubuntu-latest
    container: node:24-alpine
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check
